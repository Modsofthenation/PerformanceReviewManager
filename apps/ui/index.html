<!doctype html>
<html lang="en" data-theme="dark" data-color-mode="system" data-accent="teal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Performance Review Manager</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("prm_theme");
          if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "system";
          var accent = localStorage.getItem("prm_accent");
          if (accent !== "teal" && accent !== "ocean" && accent !== "forest" && accent !== "slate") {
            accent = "teal";
          }
          var resolved = mode;
          if (mode === "system") {
            resolved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute("data-color-mode", mode);
          document.documentElement.setAttribute("data-accent", accent);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("data-color-mode", "system");
          document.documentElement.setAttribute("data-accent", "teal");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
